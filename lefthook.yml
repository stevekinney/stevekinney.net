pre-commit:
  piped: true
  commands:
    content-metadata:
      priority: 10
      glob: ['writing/*.md', 'courses/**/*.md']
      run: bun packages/scripts/check-content-metadata.ts --fix {staged_files}
      stage_fixed: true
    repository-guards:
      priority: 40
      run: ./.lefthook/pre-commit/repository-guards.sh
    staged-code-format:
      priority: 50
      glob: '**/*.{js,jsx,ts,tsx,svelte}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    staged-code-lint:
      priority: 60
      glob: '**/*.{js,jsx,ts,tsx,svelte}'
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    staged-format:
      priority: 70
      glob: '**/*.{css,md,html,json}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
