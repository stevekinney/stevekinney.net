name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Static Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup-workspace
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Run validation
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: bun run continuous-integration:validate

  build:
    name: Build
    needs: validation
    runs-on: ubuntu-latest
    env:
      VERCEL: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup-workspace
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Build website
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: bun run continuous-integration:build

      - name: Run OG metadata tests
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          PUBLIC_SITE_URL: https://stevekinney.com
        run: bun run test:og-metadata

      - name: Check build budget
        run: bun run check-build-budget

      - name: Upload build report
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: |
            tmp/build-report
            .turbo/runs/*.json
          if-no-files-found: error

      - name: Upload website build output
        uses: actions/upload-artifact@v7
        with:
          name: website-build-output
          path: |
            applications/website/build
            applications/website/.svelte-kit/output
            applications/website/.generated
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup-workspace
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Verify Chrome browser
        run: google-chrome --version

      - name: Download website build output
        uses: actions/download-artifact@v8
        with:
          name: website-build-output
          path: applications/website

      - name: Run integration tests
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: bun run test:integration

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            applications/website/playwright-report
            applications/website/test-results
          if-no-files-found: ignore
