# Prices for the model calculator at /experiments/model-calculator.
#
# Every price is in US dollars per million tokens. To add a model, copy a
# [[models]] block. The page validates this file when it builds, so a typo or
# an unknown key fails the build instead of rendering a wrong price. Rows render
# in the order they appear here.
#
# Required fields:
#   name         Model name as it should appear in the table.
#   provider     Company that sells the model.
#   input        Uncached input tokens.
#   cachedInput  Input tokens read from the provider's prompt cache.
#   output       Output tokens, including reasoning or thinking tokens.
#
# Optional fields:
#   variant              Qualifier shown after the name, such as a prompt-size
#                        or time-of-day tier.
#   cacheWrite5m         Input tokens written to a five-minute prompt-cache entry.
#   cacheWrite1h         Input tokens written to a one-hour prompt-cache entry.
#                        Only set these for providers that charge a premium for
#                        cache writes. When they're missing, cache writes are
#                        billed at the `input` price.
#   maximumPromptTokens  The listed prices only apply to requests whose prompt is
#                        at most this many tokens. The page flags sessions that
#                        sent larger prompts.
#   identifiers          Model IDs as Claude Code and Codex record them in session
#                        files, so a dropped session can find its row. A dated
#                        snapshot such as claude-haiku-4-5-20251001 matches the
#                        undated identifier.

